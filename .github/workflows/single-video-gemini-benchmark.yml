name: Single-video Android benchmark

on:
  push:
    branches: [perf/single-video]

permissions:
  contents: read

concurrency:
  group: single-video-gemini-benchmark
  cancel-in-progress: false

jobs:
  android-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check benchmark secret
        env:
          GEMINI_BENCHMARK_API_KEY: ${{ secrets.GEMINI_BENCHMARK_API_KEY }}
        run: |
          if [ -z "$GEMINI_BENCHMARK_API_KEY" ]; then
            echo 'Add GEMINI_BENCHMARK_API_KEY as a repository Actions secret, then rerun.' >&2
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Find or install Android command-line tools
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -w "$sdk_root" ]]; then sdk_root="$RUNNER_TEMP/android-sdk"; fi
          mkdir -p "$sdk_root"
          export ANDROID_HOME="$sdk_root" ANDROID_SDK_ROOT="$sdk_root"
          cli="$sdk_root/cmdline-tools/latest/bin"
          if [[ ! -x "$cli/sdkmanager" ]]; then
            for installed in "$sdk_root"/cmdline-tools/*/bin; do
              if [[ -x "$installed/sdkmanager" ]]; then cli="$installed"; break; fi
            done
          fi
          if [[ ! -x "$cli/sdkmanager" ]]; then
            archive="$RUNNER_TEMP/android-cli.zip"
            curl -fsSL --retry 3 --max-time 180 \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$archive"
            echo "7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee  $archive" | sha256sum --check
            unzip -q "$archive" -d "$RUNNER_TEMP/android-cli"
            mkdir -p "$sdk_root/cmdline-tools"
            mv "$RUNNER_TEMP/android-cli/cmdline-tools" "$sdk_root/cmdline-tools/benchmark"
            cli="$sdk_root/cmdline-tools/benchmark/bin"
          fi
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\nANDROID_BENCHMARK_CLI=%s\n' "$sdk_root" "$sdk_root" "$cli" >> "$GITHUB_ENV"
      - name: Install Android SDK and system image
        timeout-minutes: 15
        run: |
          set -euo pipefail
          "$ANDROID_BENCHMARK_CLI/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses < <(yes)
          image='system-images;android-34;google_apis;x86_64'
          "$ANDROID_BENCHMARK_CLI/sdkmanager" --sdk_root="$ANDROID_HOME" --install 'platform-tools' 'emulator' 'platforms;android-35' 'build-tools;35.0.0' "$image"
          "$ANDROID_BENCHMARK_CLI/avdmanager" create avd --name gemini-benchmark --package "$image" <<< no
          printf '%s\n' "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sudo chmod a+rw /dev/kvm
      - name: Verify the shared benchmark clip
        run: |
          echo '86d3219ce53419eba7db1f3ff8e5e3e88b222979448030f4c649c3b9ed30bbbd  scripts/fixtures/single-video-ocr-benchmark.mp4' | sha256sum --check
      - name: Build isolated baseline and candidate APKs
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/baseline"
          git worktree add --detach "$baseline" a67e6ea910483d740fa988bcd682d18c4b93d5c7
          test_path=android-app/app/src/androidTest/java/com/gemini/ocr/batch/SingleVideoGeminiBenchmarkTest.kt
          install -D "$test_path" "$baseline/$test_path"
          python3 scripts/setup_android_asr.py
          mkdir -p "$baseline/android-app/app/libs"
          cp android-app/app/libs/sherpa-onnx-static-link-onnxruntime-2.0.1-app.aar "$baseline/android-app/app/libs/"
          (cd "$baseline/android-app" && bash gradlew --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest -PverificationAppId=com.gemini.ocr.perfbase)
          (cd android-app && bash gradlew --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest -PverificationAppId=com.gemini.ocr.perfnext)
      - name: Start one Android emulator
        run: |
          set -euo pipefail
          emulator_log="$RUNNER_TEMP/emulator.log"
          trap 'tail -80 "$emulator_log"' ERR
          "$ANDROID_HOME/emulator/emulator" -avd gemini-benchmark -accel on -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect -cores 2 -memory 2048 > "$emulator_log" 2>&1 &
          timeout 240 adb wait-for-device
          timeout 240 bash -c 'until [[ $(adb shell getprop sys.boot_completed | tr -d "\r") == 1 ]]; do sleep 3; done'
          adb shell input keyevent 82
      - name: Measure baseline and candidate with native OCR and Gemini
        env:
          GEMINI_BENCHMARK_API_KEY: ${{ secrets.GEMINI_BENCHMARK_API_KEY }}
        run: |
          bash scripts/run_single_video_gemini_benchmark.sh "$RUNNER_TEMP/baseline" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/results" "$GITHUB_WORKSPACE/scripts/fixtures/single-video-ocr-benchmark.mp4"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-video-android-results
          path: ${{ runner.temp }}/results/*.json
          retention-days: 7
